<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks</title>
    <style>
      :root {
        --bg: #010401;
        --green: #33ff66;
        --green-dim: #1e9c44;
        --green-dark: #0d5424;
        --glow-rgb: 51, 255, 102;
        --glow: 0 0 5px rgba(var(--glow-rgb), 0.55);
      }

      /* Thèmes alternatifs (sélecteur en bas de page) */
      html[data-theme="blue"] {
        --green: #4da6ff;
        --green-dim: #2e6db3;
        --green-dark: #163a66;
        --glow-rgb: 77, 166, 255;
      }

      html[data-theme="red"] {
        --green: #ff4040;
        --green-dim: #b32828;
        --green-dark: #661414;
        --glow-rgb: 255, 64, 64;
      }

      html[data-theme="orange"] {
        --green: #ffb000;
        --green-dim: #b37a00;
        --green-dark: #6b4a02;
        --glow-rgb: 255, 176, 0;
      }

      html[data-theme="white"] {
        --green: #f0f0f0;
        --green-dim: #9c9c9c;
        --green-dark: #545454;
        --glow-rgb: 240, 240, 240;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--green);
        font-family: "Courier New", ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 15px;
        line-height: 1.6;
        text-shadow: var(--glow);
      }

      /* Effet scanlines CRT */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(to bottom,
            rgba(0, 0, 0, 0) 0px,
            rgba(0, 0, 0, 0) 2px,
            rgba(0, 0, 0, 0.25) 3px);
        mix-blend-mode: multiply;
      }

      /* Léger vignettage d'écran cathodique */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center,
            rgba(0, 0, 0, 0) 60%,
            rgba(0, 0, 0, 0.5) 100%);
      }

      main {
        max-width: 780px;
        margin: 0 auto;
        padding: 1.5rem 1rem 4rem;
      }

      #banner {
        display: block;
        width: 100%;
        max-width: 520px;
        margin: 0 0 1rem;
        color: var(--green);
        filter: drop-shadow(0 0 6px rgba(var(--glow-rgb), 0.45));
      }

      .sysinfo {
        color: var(--green-dim);
        margin: 0 0 1.5rem;
      }

      /* Horloge dans son cadre façon TUI */
      .clock-frame {
        display: inline-block;
        border: 1px solid var(--green-dim);
        border-radius: 2px;
        padding: 0.25rem 1rem 0.4rem;
        margin: 0 0 1.5rem;
      }

      .clock-frame legend {
        color: var(--green-dim);
        font-size: 12px;
        padding: 0 0.5ch;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      #clock {
        font-size: 1.1rem;
        letter-spacing: 0.08em;
      }

      .prompt {
        color: var(--green);
      }

      .prompt .user {
        color: var(--green-dim);
      }

      /* Recherche web Startpage, dans son cadre */
      .web-search {
        margin: 0 0 2rem;
      }

      .web-search fieldset {
        border: 1px solid var(--green-dim);
        border-radius: 2px;
        margin: 0;
        transition: border-color 0.15s;
      }

      .web-search fieldset:focus-within {
        border-color: var(--green);
      }

      .web-search legend {
        color: var(--green-dim);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .web-search .search-line {
        margin: 0;
        flex-wrap: wrap;
      }

      .web-search .search-line input {
        flex: 1 1 16ch;
        padding-left: 8px;
      }

      /* Ligne de recherche façon prompt */
      .search-line {
        display: flex;
        align-items: baseline;
        gap: 0.5ch;
        margin: 0 0 1.5rem;
        white-space: nowrap;
      }

      .search-line input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        color: var(--green);
        font: inherit;
        text-shadow: var(--glow);
        caret-color: var(--green);
        padding: 0;
        padding-left: 8px;
      }

      .search-line input:focus {
        outline: none;
      }

      /* Masque la croix "effacer" native des input type=search */
      .search-line input {
        appearance: none;
        -webkit-appearance: none;
      }

      .search-line input::-webkit-search-cancel-button,
      .search-line input::-webkit-search-decoration,
      .search-line input::-webkit-search-results-button,
      .search-line input::-webkit-search-results-decoration {
        -webkit-appearance: none;
        display: none;
      }

      section {
        margin-bottom: 1.75rem;
      }

      section h2 {
        font-size: inherit;
        font-weight: normal;
        margin: 0 0 0.5rem;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0 0 0 2ch;
      }

      li a {
        display: flex;
        align-items: baseline;
        gap: 1ch;
        color: var(--green);
        text-decoration: none;
        padding: 0.1rem 0.5ch;
      }

      li a::before {
        content: ">";
        color: var(--green-dim);
      }

      li a .title {
        flex-shrink: 0;
      }

      li a .fill {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        color: var(--green-dark);
      }

      li a .open {
        flex-shrink: 0;
        color: var(--green-dim);
      }

      li a:hover {
        background: var(--green);
        color: var(--bg);
        text-shadow: none;
      }

      li a:hover::before,
      li a:hover .fill,
      li a:hover .open {
        color: var(--bg);
      }

      li .desc {
        display: block;
        padding-left: 4ch;
        color: var(--green-dim);
        font-size: 13px;
      }

      .empty {
        color: var(--green-dim);
      }

      /* Sélecteur de thème */
      .theme-line {
        margin: 0 0 0.5rem;
        color: var(--green-dim);
      }

      .theme-line button {
        background: none;
        border: none;
        padding: 0;
        margin: 0 0.5ch;
        font: inherit;
        color: var(--green-dim);
        text-shadow: inherit;
        cursor: pointer;
      }

      .theme-line button::before {
        content: "\00a0";
      }

      .theme-line button::after {
        content: "\00a0";
      }

      .theme-line button:hover {
        color: var(--green);
      }

      .theme-line button.active {
        color: var(--green);
      }

      .theme-line button.active::before {
        content: "[";
      }

      .theme-line button.active::after {
        content: "]";
      }

      /* Responsive : sur petit écran, on raccourcit les prompts
         et on laisse le champ de saisie passer à la ligne si besoin */
      @media (max-width: 600px) {
        .prompt .user {
          display: none;
        }

        .search-line {
          flex-wrap: wrap;
        }

        .search-line input {
          flex: 1 1 12ch;
        }

        .web-search .search-line {
          font-size: 1rem;
        }
      }
    </style>
  </head>

  <body>

    <main>
      <form class="web-search" action="https://www.startpage.com/sp/search" method="get">
        <fieldset>
          <legend>web.search</legend>
          <div class="search-line">
            <span class="prompt"><span class="user">root@bookmarks:</span>~$ startpage --search</span>
            <input name="query" type="search" spellcheck="false" autofocus aria-label="Search the web with Startpage"
              placeholder="Search the web...">
          </div>
        </fieldset>
      </form>

      <header>
        <svg id="banner" viewBox="0 0 464 64" role="img" aria-label="BOOKMARKS"></svg>
        <p class="sysinfo">BOOKMARKS BIOS v1.0 -- 640K RAM OK -- 56k LINK ESTABLISHED...</p>
        <fieldset class="clock-frame">
          <legend>sys.clock</legend>
          <span id="clock">--- -- --- ----&nbsp;&nbsp;--:--:--</span>
        </fieldset>
      </header>

      <div class="theme-line">
        <span class="prompt"><span class="user">root@bookmarks:</span>~$ setterm --color</span>
        <button data-theme="green">green</button>
        <button data-theme="blue">blue</button>
        <button data-theme="red">red</button>
        <button data-theme="orange">orange</button>
        <button data-theme="white">white</button>
      </div>

      <div class="search-line">
        <span class="prompt"><span class="user">root@bookmarks:</span>~$ grep</span>
        <input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="Filter bookmarks"
          placeholder="Filter bookmarks...">
      </div>

      <div id="bookmarks"></div>
      <p class="empty" id="empty" hidden>grep: no matches found</p>
    </main>

    <!-- La liste des favoris : c'est ici qu'on ajoute / modifie les liens -->
    <script id="data" type="application/json">
      {
        "categories": [
          {
            "name": "Dev",
            "links": [
              { "title": "GitHub", "url": "https://github.com" },
              { "title": "MDN Web Docs", "url": "https://developer.mozilla.org", "description": "Référence HTML / CSS / JS" }
            ]
          },
          {
            "name": "Outils",
            "links": [
              { "title": "Claude", "url": "https://claude.ai" }
            ]
          }
        ]
      }
    </script>

    <script>
      const data = JSON.parse(document.getElementById("data").textContent);
      const container = document.getElementById("bookmarks");
      const emptyMsg = document.getElementById("empty");
      const searchInput = document.getElementById("search");

      // Bannière "BOOKMARKS" : lettres 14 segments en négatif sur bloc plein,
      // avec un dégradé tramé (matrice de Bayer) sur la gauche
      function renderBanner() {
        const svg = document.getElementById("banner");
        const NS = "http://www.w3.org/2000/svg";
        const SEGS = {
          A: [2.5, 0, 21.5, 0], B: [24, 2.5, 24, 17.5], C: [24, 22.5, 24, 37.5],
          D: [2.5, 40, 21.5, 40], E: [0, 22.5, 0, 37.5], F: [0, 2.5, 0, 17.5],
          G1: [2.5, 20, 9.5, 20], G2: [14.5, 20, 21.5, 20],
          H: [2.5, 2.5, 9.5, 17.5], I: [12, 2.5, 12, 17.5], J: [21.5, 2.5, 14.5, 17.5],
          K: [9.5, 22.5, 2.5, 37.5], L: [12, 22.5, 12, 37.5], M: [14.5, 22.5, 21.5, 37.5]
        };
        const LETTERS = {
          B: ["A", "B", "C", "D", "I", "L", "G2"],
          O: ["A", "B", "C", "D", "E", "F"],
          K: ["E", "F", "G1", "J", "M"],
          M: ["B", "C", "E", "F", "H", "J"],
          A: ["A", "B", "C", "E", "F", "G1", "G2"],
          R: ["A", "B", "E", "F", "G1", "G2", "M"],
          S: ["A", "C", "D", "F", "G1", "G2"]
        };
        const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

        const block = document.createElementNS(NS, "rect");
        block.setAttribute("x", 120);
        block.setAttribute("y", 0);
        block.setAttribute("width", 344);
        block.setAttribute("height", 64);
        block.setAttribute("fill", "currentColor");
        svg.appendChild(block);

        for (let gx = 0; gx < 15; gx++) {
          for (let gy = 0; gy < 8; gy++) {
            if (BAYER[gy % 4][gx % 4] < ((gx + 1) / 15) * 16) {
              const dot = document.createElementNS(NS, "rect");
              dot.setAttribute("x", gx * 8 + 2.5);
              dot.setAttribute("y", gy * 8 + 2.5);
              dot.setAttribute("width", 3);
              dot.setAttribute("height", 3);
              dot.setAttribute("fill", "currentColor");
              svg.appendChild(dot);
            }
          }
        }

        "BOOKMARKS".split("").forEach((ch, i) => {
          const g = document.createElementNS(NS, "g");
          g.setAttribute("transform", `translate(${140 + i * 36}, 12)`);
          for (const seg of LETTERS[ch]) {
            const [x1, y1, x2, y2] = SEGS[seg];
            const line = document.createElementNS(NS, "line");
            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.setAttribute("stroke", "var(--bg)");
            line.setAttribute("stroke-width", 4);
            line.setAttribute("stroke-linecap", "round");
            g.appendChild(line);
          }
          svg.appendChild(g);
        });
      }

      function slugify(name) {
        return name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      }

      function render(filter = "") {
        const query = filter.trim().toLowerCase();
        container.innerHTML = "";
        let total = 0;

        for (const category of data.categories) {
          const links = category.links.filter(link =>
            !query ||
            link.title.toLowerCase().includes(query) ||
            link.url.toLowerCase().includes(query) ||
            (link.description || "").toLowerCase().includes(query)
          );
          if (links.length === 0) continue;
          total += links.length;

          const section = document.createElement("section");

          const heading = document.createElement("h2");
          heading.className = "prompt";
          const user = document.createElement("span");
          user.className = "user";
          user.textContent = "root@bookmarks:";
          heading.append(user, `~$ ls ./${slugify(category.name)}`);
          section.appendChild(heading);

          const list = document.createElement("ul");
          for (const link of links) {
            const item = document.createElement("li");
            const anchor = document.createElement("a");
            anchor.href = link.url;
            anchor.rel = "noopener";
            anchor.title = link.url;

            const title = document.createElement("span");
            title.className = "title";
            title.textContent = link.title;

            const fill = document.createElement("span");
            fill.className = "fill";
            fill.textContent = ".".repeat(120);

            const open = document.createElement("span");
            open.className = "open";
            open.textContent = "[OPEN]";

            anchor.append(title, fill, open);
            item.appendChild(anchor);

            if (link.description) {
              const desc = document.createElement("span");
              desc.className = "desc";
              desc.textContent = `# ${link.description}`;
              item.appendChild(desc);
            }

            list.appendChild(item);
          }
          section.appendChild(list);
          container.appendChild(section);
        }

        emptyMsg.hidden = total > 0;
      }

      const clock = document.getElementById("clock");

      function updateClock() {
        const now = new Date();
        const date = now.toLocaleDateString("en-GB", {
          weekday: "short", day: "2-digit", month: "short", year: "numeric"
        }).replace(/,/g, "").toUpperCase();
        const time = now.toLocaleTimeString("en-GB", { hour12: false });
        clock.textContent = `${date}  ${time}`;
      }

      updateClock();
      setInterval(updateClock, 1000);

      // Sélecteur de thème (persistant via localStorage)
      const themeButtons = document.querySelectorAll(".theme-line button");

      function applyTheme(theme) {
        if (theme === "green") {
          delete document.documentElement.dataset.theme;
        } else {
          document.documentElement.dataset.theme = theme;
        }
        themeButtons.forEach(b => b.classList.toggle("active", b.dataset.theme === theme));
      }

      let savedTheme = "green";
      try { savedTheme = localStorage.getItem("theme") || "green"; } catch (e) { }
      applyTheme(savedTheme);

      themeButtons.forEach(button => {
        button.addEventListener("click", () => {
          applyTheme(button.dataset.theme);
          try { localStorage.setItem("theme", button.dataset.theme); } catch (e) { }
        });
      });

      searchInput.addEventListener("input", () => render(searchInput.value));
      renderBanner();
      render();
    </script>

  </body>

</html>
